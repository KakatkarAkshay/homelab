name: Renovate

on:
  schedule:
    - cron: "17 * * * *"
  issues:
    types: [edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate

jobs:
  renovate:
    name: renovate
    if: github.event_name != 'issues' || (github.actor == github.repository_owner && github.event.issue.title == 'Dependency Dashboard')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@37beffda261423addd537c33f2d126df7f6ffbab # v46.2.6
        with:
          renovate-version: 44.82.0
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: info
          NODE_OPTIONS: --unhandled-rejections=strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
