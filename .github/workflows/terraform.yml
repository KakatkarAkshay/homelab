name: Terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  proxmox:
    name: ${{ github.event_name == 'pull_request' && 'Proxmox Plan' || 'Proxmox Plan and Apply' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/proxmox

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_oci_fingerprint: ${{ vars.TF_VAR_OCI_FINGERPRINT }}
      TF_VAR_oci_private_key: ${{ secrets.TF_VAR_OCI_PRIVATE_KEY }}
      TF_VAR_tenancy_1_ocid: ${{ secrets.TF_VAR_TENANCY_1_OCID }}
      TF_VAR_tenancy_1_user_ocid: ${{ secrets.TF_VAR_TENANCY_1_USER_OCID }}
      TF_VAR_proxmox_api_token: ${{ secrets.TF_VAR_PROXMOX_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_infisical_auth_method: oidc
      TF_VAR_infisical_host: ${{ vars.TF_VAR_INFISICAL_HOST }}
      TF_VAR_infisical_org_id: ${{ vars.TF_VAR_INFISICAL_ORG_ID }}
      TF_VAR_newt_id: ${{ secrets.TF_VAR_NEWT_ID }}
      TF_VAR_newt_secret: ${{ secrets.TF_VAR_NEWT_SECRET }}
      INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Fetch OIDC token for Infisical
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const jwt = await core.getIDToken("homelab-terraform")
            core.setSecret(jwt)
            core.exportVariable("INFISICAL_AUTH_JWT", jwt)

      - name: Configure OCI API key
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/oci_api_key.pem"
          printf '%s' "$TF_VAR_oci_private_key" > "$RUNNER_TEMP/oci_api_key.pem"

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:ci
          use-cache: "true"

      - name: Verify Proxmox network access
        run: curl --insecure --silent --show-error --output /dev/null --connect-timeout 10 https://192.168.20.2:8006/api2/json/version

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize
        run: >-
          terraform init -input=false
          -backend-config="tenancy_ocid=$TF_VAR_tenancy_1_ocid"
          -backend-config="user_ocid=$TF_VAR_tenancy_1_user_ocid"
          -backend-config="fingerprint=$TF_VAR_oci_fingerprint"
          -backend-config="private_key_path=$RUNNER_TEMP/oci_api_key.pem"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -no-color tfplan
