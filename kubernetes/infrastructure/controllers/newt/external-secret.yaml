apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: newt-credentials
  namespace: newt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: newt-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PANGOLIN_ENDPOINT
      remoteRef:
        key: /platform/newt/PANGOLIN_ENDPOINT
    - secretKey: NEWT_ID
      remoteRef:
        key: /platform/newt/NEWT_ID
    - secretKey: NEWT_SECRET
      remoteRef:
        key: /platform/newt/NEWT_SECRET
