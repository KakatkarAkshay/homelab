apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  releaseName: cert-manager
  targetNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: v1.21.1
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: cert-manager
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true
    config:
      gatewayAPI:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    webhook:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
    cainjector:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
