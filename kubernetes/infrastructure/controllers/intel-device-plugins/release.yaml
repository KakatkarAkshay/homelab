apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: intel-device-plugins-operator
  targetNamespace: intel-device-plugins
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: 0.36.0
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: intel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    manager:
      devices:
        gpu: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-gpu
  namespace: flux-system
spec:
  interval: 30m
  releaseName: intel-device-plugins-gpu
  targetNamespace: intel-device-plugins
  dependsOn:
    - name: intel-device-plugins-operator
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.36.0
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: intel
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    name: gpu
    sharedDevNum: 2
    logLevel: 2
    enableMonitoring: true
    # The Gen7 HD 4000 cannot serve the codecs Immich asks for.
    denyIDs: "0x0166"
    nodeFeatureRule: false
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"
