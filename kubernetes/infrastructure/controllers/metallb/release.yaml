apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 30m
  releaseName: metallb
  targetNamespace: metallb-system
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: metallb
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
