apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  releaseName: traefik
  targetNamespace: traefik
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: traefik
      version: 41.2.0
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      replicas: 1
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false
        ingressEndpoint:
          hostname: homelab-gateway.kakatkarakshay.dev
      kubernetesGateway:
        enabled: true
        statusAddress:
          hostname: homelab-gateway.kakatkarakshay.dev
          service:
            enabled: false
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
    ingressRoute:
      dashboard:
        enabled: false
    service:
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.30.10
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
    ports:
      web:
        port: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
        forwardedHeaders:
          trustedIPs:
            - 10.244.0.0/16
      websecure:
        port: 443
        transport:
          respondingTimeouts:
            readTimeout: 0
        forwardedHeaders:
          trustedIPs:
            - 10.244.0.0/16
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: authentik-forward-auth
          namespace: traefik
        spec:
          forwardAuth:
            address: http://authentik-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
            trustForwardHeader: true
            authResponseHeaders:
              - X-authentik-username
              - X-authentik-groups
              - X-authentik-entitlements
              - X-authentik-email
              - X-authentik-name
              - X-authentik-uid
              - X-authentik-jwt
              - X-authentik-meta-jwks
              - X-authentik-meta-outpost
              - X-authentik-meta-provider
              - X-authentik-meta-app
              - X-authentik-meta-version
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: dashboard-redirect
          namespace: traefik
        spec:
          redirectRegex:
            regex: ^https?://homelab\.kakatkarakshay\.dev/?$
            replacement: https://homelab.kakatkarakshay.dev/dashboard/
            permanent: true
      - apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: traefik-dashboard
          namespace: traefik
          annotations:
            external-dns.alpha.kubernetes.io/target: homelab-gateway.kakatkarakshay.dev
        spec:
          entryPoints:
            - websecure
          tls:
            secretName: homelab-kakatkarakshay-dev-tls
          routes:
            - kind: Rule
              match: Host(`homelab.kakatkarakshay.dev`) && Path(`/`)
              middlewares:
                - name: dashboard-redirect
              services:
                - kind: TraefikService
                  name: api@internal
            - kind: Rule
              match: Host(`homelab.kakatkarakshay.dev`) && PathPrefix(`/outpost.goauthentik.io/`)
              priority: 100
              services:
                - kind: Service
                  name: authentik-outpost
                  namespace: authentik
                  port: 9000
            - kind: Rule
              match: Host(`homelab.kakatkarakshay.dev`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
              middlewares:
                - name: authentik-forward-auth
              services:
                - kind: TraefikService
                  name: api@internal
