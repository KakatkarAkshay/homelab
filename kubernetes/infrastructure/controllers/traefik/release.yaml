apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  releaseName: traefik
  targetNamespace: traefik
  dependsOn:
    - name: cert-manager
  chart:
    spec:
      chart: traefik
      version: 41.2.0
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      replicas: 1
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false
        ingressEndpoint:
          hostname: homelab-gateway.kakatkarakshay.dev
      kubernetesGateway:
        enabled: true
        statusAddress:
          hostname: homelab-gateway.kakatkarakshay.dev
          service:
            enabled: false
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
    ingressRoute:
      dashboard:
        enabled: false
    service:
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.30.10
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
    ports:
      web:
        port: 80
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
        forwardedHeaders:
          trustedIPs:
            - 10.244.0.0/16
      websecure:
        port: 443
        forwardedHeaders:
          trustedIPs:
            - 10.244.0.0/16
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
