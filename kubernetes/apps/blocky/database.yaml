apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idrive-e2-credentials
  namespace: blocky
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: idrive-e2-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /platform/idrive-credentials/ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /platform/idrive-credentials/ACCESS_SECRET_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /platform/idrive-credentials/AWS_REGION
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: blocky-idrive-e2
  namespace: blocky
spec:
  configuration:
    destinationPath: s3://cloudnativepg-backup/blocky-homelab/
    endpointURL: https://s3.eu-central-2.idrivee2.com
    s3Credentials:
      accessKeyId:
        name: idrive-e2-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: idrive-e2-credentials
        key: ACCESS_SECRET_KEY
      region:
        name: idrive-e2-credentials
        key: AWS_REGION
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 2
  retentionPolicy: 14d
  instanceSidecarConfiguration:
    retentionPolicyIntervalSeconds: 3600
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: blocky-postgresql
  namespace: blocky
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  bootstrap:
    initdb:
      database: blocky
      owner: blocky
  storage:
    size: 10Gi
    storageClass: longhorn
  walStorage:
    size: 2Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: blocky-idrive-e2
        serverName: blocky-postgresql
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: blocky-postgresql
  namespace: blocky
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: blocky-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: blocky-idrive-e2
