apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky-ui
  namespace: flux-system
spec:
  interval: 30m
  releaseName: blocky-ui
  targetNamespace: blocky
  dependsOn:
    - name: blocky
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1001
        runAsGroup: 65533
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      blocky-ui:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/gabeduartem/blocky-ui
              tag: 2.0.0@sha256:fb614982e1a28674e242dba14b804a4e19cec54034b9c5f36ef35a245a1758cf
            env:
              - name: BLOCKY_API_URL
                value: http://blocky-app.blocky.svc.cluster.local:4000
              - name: QUERY_LOG_TYPE
                value: postgresql
              - name: QUERY_LOG_TARGET
                valueFrom:
                  secretKeyRef:
                    name: blocky-postgresql-app
                    key: uri
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: blocky-ui
        ports:
          http:
            port: 3000
