apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: blocky
spec:
  forwardAuth:
    address: http://authentik-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blocky-ui
  namespace: blocky
spec:
  parentRefs:
    - name: blocky-ui
  hostnames:
    - blocky-homelab.kakatkarakshay.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/
      backendRefs:
        - name: authentik-outpost
          namespace: authentik
          port: 9000
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: blocky-ui
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blocky-doh
  namespace: blocky
  annotations:
    external-dns.alpha.kubernetes.io/gateway-hostname-source: annotation-only
spec:
  parentRefs:
    - name: blocky-dns
  hostnames:
    - dns.kakatkarakshay.dev
    - "*.dns.kakatkarakshay.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dns-query
      backendRefs:
        - name: blocky-app
          port: 4000
