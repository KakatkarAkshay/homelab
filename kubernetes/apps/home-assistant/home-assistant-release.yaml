apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: home-assistant
  targetNamespace: home-assistant
  chart:
    spec:
      chart: home-assistant
      version: 0.3.76
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: home-assistant
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    image:
      repository: ghcr.io/home-assistant/home-assistant
      tag: 2026.8.3@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
    controller:
      type: Deployment
    deploymentStrategy: Recreate
    podAnnotations:
      k8s.v1.cni.cncf.io/networks: |
        [{"name":"iot","namespace":"home-assistant","ips":["192.168.10.33/24"]}]
    serviceAccount:
      create: false
      name: home-assistant
    env:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: home-assistant-postgresql-app
            key: uri
    service:
      port: 8123
    startupProbe:
      failureThreshold: 30
      httpGet:
        path: /
        port: http
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 2
    persistence:
      enabled: true
      existingClaim: home-assistant-pvc
    configuration:
      enabled: true
      templateConfig: |-
        default_config:

        http:
          use_x_forwarded_for: true
          trusted_proxies:
            - 10.244.0.0/16
            - fd00:10:244::/56

        recorder:
          purge_keep_days: 30
          commit_interval: 3
          db_url: !env_var DATABASE_URL

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml
      initContainer:
        image: ghcr.io/home-assistant/home-assistant:2026.8.3@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
      initScript: |-
        #!/bin/sh
        set -eu

        if [ ! -f /config/configuration.yaml ]; then
          cp /config-templates/configuration.yaml /config/configuration.yaml
        fi

        for include_file in automations.yaml scripts.yaml scenes.yaml; do
          if [ ! -f "/config/$include_file" ]; then
            touch "/config/$include_file"
          fi
        done

        python3 - <<'PY'
        import io
        import shutil
        import urllib.request
        import zipfile
        from pathlib import Path

        with urllib.request.urlopen("https://github.com/hacs/integration/releases/latest/download/hacs.zip") as response:
            content = response.read()

        target = Path("/config/custom_components/hacs")
        with zipfile.ZipFile(io.BytesIO(content)) as archive:
            shutil.rmtree(target, ignore_errors=True)
            target.mkdir(parents=True)
            archive.extractall(target)
        PY
    resources:
      requests:
        cpu: 75m
        memory: 512Mi
      limits:
        memory: 2Gi
