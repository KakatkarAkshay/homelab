apiVersion: v1
kind: Service
metadata:
  name: matter-server
  namespace: home-assistant
spec:
  selector:
    app.kubernetes.io/name: matter-server
  ports:
    - name: http
      port: 5580
      protocol: TCP
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-server
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{"name":"iot","namespace":"home-assistant","ips":["192.168.10.34/24"]}]
    spec:
      serviceAccountName: matter-server
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      enableServiceLinks: false
      initContainers:
        - name: remove-stale-lock
          image: ghcr.io/matter-js/matterjs-server:1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - rm -f /data/matter.lock
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
          imagePullPolicy: IfNotPresent
          env:
            - name: STORAGE_PATH
              value: /data
          ports:
            - name: http
              containerPort: 5580
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 12
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 12
            timeoutSeconds: 5
            failureThreshold: 4
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
