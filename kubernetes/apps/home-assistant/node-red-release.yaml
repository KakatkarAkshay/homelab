apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-red
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: node-red
  targetNamespace: home-assistant
  chart:
    spec:
      chart: node-red
      version: 0.40.2
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: node-red
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    deploymentStrategy: Recreate
    image:
      registry: docker.io
      repository: nodered/node-red
      tag: 5.0.6@sha256:02a2b92a41b73d2bc388238b86e4fcaab7fb5466373adb24e1df6aa5845265ff
    rbac:
      enabled: false
    serviceAccount:
      create: false
      name: node-red
    persistence:
      enabled: true
      existingClaim: node-red
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
