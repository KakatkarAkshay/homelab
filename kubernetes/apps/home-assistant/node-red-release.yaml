apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-red
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: node-red
  targetNamespace: home-assistant
  chart:
    spec:
      chart: node-red
      version: 0.40.2
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: node-red
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    deploymentStrategy: Recreate
    image:
      registry: docker.io
      repository: nodered/node-red
      pullPolicy: IfNotPresent
      tag: 5.0.4@sha256:10f40d0a83e7e5852b13d4d472b2006b05b1cca6d55e2f29a55a12c25a630cb6
    rbac:
      enabled: false
    serviceAccount:
      create: false
      name: node-red
    persistence:
      enabled: true
      existingClaim: node-red-data
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
