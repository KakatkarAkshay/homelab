apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-home-assistant
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: volsync-home-assistant
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "s3:https://{{ .endpoint }}/volsync/home-assistant/home-assistant"
        RESTIC_PASSWORD: "{{ .resticPassword }}"
        AWS_ACCESS_KEY_ID: "{{ .accessKeyID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
  data:
    - secretKey: accessKeyID
      remoteRef:
        key: /platform/idrive-credentials/ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: /platform/idrive-credentials/ACCESS_SECRET_KEY
    - secretKey: endpoint
      remoteRef:
        key: /platform/idrive-credentials/E2_ENDPOINT
    - secretKey: resticPassword
      remoteRef:
        key: /platform/volsync/RESTIC_PASSWORD
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  sourcePVC: home-assistant-pvc
  trigger:
    schedule: "0 */6 * * *"
  restic:
    repository: volsync-home-assistant
    copyMethod: Snapshot
    volumeSnapshotClassName: longhorn-snap
    storageClassName: longhorn
    cacheCapacity: 2Gi
    cacheStorageClassName: longhorn
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: home-assistant-dst
  namespace: home-assistant
spec:
  trigger:
    manual: restore-1
  restic:
    repository: volsync-home-assistant
    copyMethod: Snapshot
    volumeSnapshotClassName: longhorn-snap
    storageClassName: longhorn
    cacheCapacity: 2Gi
    cacheStorageClassName: longhorn
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    accessModes:
      - ReadWriteOnce
    capacity: 10Gi
---
