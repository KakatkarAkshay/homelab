apiVersion: v1
kind: Service
metadata:
  name: bluebubbles
  namespace: bluebubbles
spec:
  ports:
    - name: http
      port: 1234
      targetPort: 1234
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: bluebubbles
  namespace: bluebubbles
  labels:
    kubernetes.io/service-name: bluebubbles
addressType: IPv4
ports:
  - name: http
    port: 1234
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.20.4
    conditions:
      ready: true
