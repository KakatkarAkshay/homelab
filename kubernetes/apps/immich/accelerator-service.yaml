apiVersion: v1
kind: Service
metadata:
  name: immich-accelerator
  namespace: immich
spec:
  ports:
    - name: http
      port: 8420
      targetPort: 8420
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: immich-accelerator
  namespace: immich
  labels:
    kubernetes.io/service-name: immich-accelerator
addressType: IPv4
ports:
  - name: http
    port: 8420
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.20.4
    conditions:
      ready: true
