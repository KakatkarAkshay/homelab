apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
  namespace: immich
spec:
  replicas: 1
  image: ghcr.io/dragonflydb/dragonfly:v1.40.2@sha256:18afa43e911f1dff18c7d1eb452361876d9702bb1cdff5c5d75c69617a4065c9
  imagePullPolicy: IfNotPresent
  args:
    - --proactor_threads=2
    - --default_lua_flags=allow-undeclared-keys
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-external
  namespace: immich
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.30.14
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    - 192.168.20.4/32
  selector:
    app: dragonfly
    app.kubernetes.io/name: dragonfly
    role: master
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-external
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.20.4/32
      ports:
        - port: 6379
          protocol: TCP
