apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: immich-accelerator
  namespace: immich
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      hostname: immich-accelerator.kakatkarakshay.dev
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: immich-accelerator-kakatkarakshay-dev-tls
