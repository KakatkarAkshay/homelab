apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: immich
  targetNamespace: immich
  chartRef:
    kind: OCIRepository
    name: immich
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            env:
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgresql-app
                    key: uri
              DB_VECTOR_EXTENSION: vectorchord
              IMMICH_TRUSTED_PROXIES: 10.244.0.0/16,fd00:10:244::/56
              IMMICH_MACHINE_LEARNING_URL: http://192.168.20.4:3003
              REDIS_HOSTNAME: dragonfly
    immich:
      configurationKind: Secret
      existingConfiguration: immich-configuration
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library
    server:
      controllers:
        main:
          strategy: Recreate
          containers:
            main:
              image:
                tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
              env:
                IMMICH_WORKERS_INCLUDE: api
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 4Gi
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/server/ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 10
                    failureThreshold: 60
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/server/ping
                      port: http
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 10
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/server/ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 10
                    failureThreshold: 5
            samba:
              image:
                repository: ghcr.io/servercontainers/samba
                tag: smbd-only-latest@sha256:a789aa42c2e5db804fab5fb5dd5f2d4343a9a8a7789e4a191aab45e993c15d4f
              env:
                NETBIOS_DISABLE: "true"
                SAMBA_CONF_MAP_TO_GUEST: Bad User
                SAMBA_VOLUME_CONFIG_immich: |-
                  [immich]
                  path = /data
                  guest ok = yes
                  guest only = yes
                  browseable = no
                  read only = no
                  force user = root
                  force group = root
                  create mask = 0664
                  directory mask = 0775
                  hosts allow = 192.168.20.4
                  oplocks = no
                  level2 oplocks = no
              ports:
                - name: smb
                  containerPort: 445
                  protocol: TCP
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    tcpSocket:
                      port: smb
                    periodSeconds: 2
                    timeoutSeconds: 2
                    failureThreshold: 30
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    tcpSocket:
                      port: smb
                    periodSeconds: 30
                    timeoutSeconds: 5
                    failureThreshold: 3
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    tcpSocket:
                      port: smb
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
      service:
        main:
          forceRename: immich-server
        smb:
          controller: main
          type: LoadBalancer
          externalTrafficPolicy: Local
          loadBalancerSourceRanges:
            - 192.168.20.4/32
          annotations:
            metallb.universe.tf/loadBalancerIPs: 192.168.30.12
          ports:
            smb:
              port: 445
              targetPort: smb
              protocol: TCP
      serviceMonitor:
        main:
          service:
            identifier: main
      persistence:
        config:
          type: secret
          name: immich-configuration
          advancedMounts:
            main:
              main:
                - path: /config
                  readOnly: true
    machine-learning:
      enabled: false
