apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: immich
  targetNamespace: immich
  chartRef:
    kind: OCIRepository
    name: immich
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            env:
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgresql-app
                    key: uri
              DB_VECTOR_EXTENSION: vectorchord
              IMMICH_TRUSTED_PROXIES: 10.244.0.0/16,fd00:10:244::/56
              REDIS_HOSTNAME: dragonfly
    immich:
      configurationKind: Secret
      existingConfiguration: immich-configuration
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library
    server:
      controllers:
        main:
          containers:
            main:
              image:
                tag: v3.0.0@sha256:685ba5c93337058ff8a189d3ed89f0ba470ef966b1c94d2eace1a3d991f9816e
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 4Gi
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                tag: v3.0.0@sha256:5b480e92a2b77618d9ccae8c8110b0eae144ec9daf86715d246ec6d39cb7a553
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  memory: 4Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-machine-learning-cache
