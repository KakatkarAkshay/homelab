apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: immich
  targetNamespace: immich
  chartRef:
    kind: OCIRepository
    name: immich
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            env:
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgresql-app
                    key: uri
              DB_VECTOR_EXTENSION: vectorchord
              IMMICH_TRUSTED_PROXIES: 10.244.0.0/16,fd00:10:244::/56
              REDIS_HOSTNAME: dragonfly
    immich:
      configurationKind: Secret
      existingConfiguration: immich-configuration
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library
    server:
      controllers:
        main:
          strategy: Recreate
          containers:
            main:
              image:
                tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 4Gi
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                tag: v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  memory: 4Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-machine-learning-cache
