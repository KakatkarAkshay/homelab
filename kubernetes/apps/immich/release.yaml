apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: immich
  targetNamespace: immich
  chartRef:
    kind: OCIRepository
    name: immich
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      main:
        containers:
          main:
            env:
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgresql-app
                    key: uri
              DB_VECTOR_EXTENSION: vectorchord
              IMMICH_TRUSTED_PROXIES: 10.244.0.0/16,fd00:10:244::/56
              REDIS_HOSTNAME: dragonfly
    immich:
      configurationKind: Secret
      existingConfiguration: immich-configuration
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library
    server:
      controllers:
        main:
          strategy: Recreate
          containers:
            main:
              image:
                tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 4Gi
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/server/ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 10
                    failureThreshold: 60
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/server/ping
                      port: http
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 10
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/server/ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 10
                    failureThreshold: 5
    machine-learning:
      controllers:
        main:
          strategy: Recreate
          containers:
            main:
              image:
                tag: v3.1.0-openvino@sha256:4b6ef958e7749fc548377bb23ee219c09c74da8decee080d76dc6a388c39b013
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  cpu: 500m
                  memory: 4Gi
                  gpu.intel.com/i915: 1
              probes:
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 10
                    failureThreshold: 60
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /ping
                      port: http
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 10
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 10
                    failureThreshold: 5
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-machine-learning-cache
