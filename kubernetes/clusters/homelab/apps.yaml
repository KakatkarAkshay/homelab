apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
    - name: multus
  interval: 10m
  retryInterval: 1m
  path: ./kubernetes/apps
  prune: true
  wait: false
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
